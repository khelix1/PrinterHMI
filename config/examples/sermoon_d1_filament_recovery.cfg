# Sermoon D1 stock direct-drive recovery. Replace the existing PAUSE / RESUME
# sections before including this file. Requires pause_resume and respond.
# Existing filament_switch_sensor filament_sensor remains unchanged.
# After 10 minutes paused the nozzle cools; bed and motors remain enabled.
# Also replaces STOP_PRINT / CANCEL_PRINT so a cooled pause can be cancelled.

[gcode_macro STOP_PRINT]
description: Finish or cancel safely, including a cooled paused print
gcode:
    {% set lift = [10.0, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min %}
    M400
    M83
    {% if printer.extruder.can_extrude %}
        G1 E-2 F1800
    {% endif %}
    {% if printer.toolhead.homed_axes == 'xyz' %}
        G91
        {% if lift > 0 %}
            G1 Z{lift} F300
        {% endif %}
        G90
        G1 X2 Y10 F3000
    {% endif %}
    M107
    TURN_OFF_HEATERS
    CLEAR_PAUSE

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    CANCEL_PRINT_BASE
    STOP_PRINT

[idle_timeout]
timeout: 600
gcode:
    {% if printer.pause_resume.is_paused %}
        M104 S0
    {% else %}
        TURN_OFF_HEATERS
        M84
    {% endif %}

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
variable_saved_temp: 0.0
variable_retracted: 0.0
gcode:
    {% if not printer.pause_resume.is_paused %}
        {% set hot = printer.extruder.can_extrude %}
        {% set lift = [10.0, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min %}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=saved_temp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE=0
        PAUSE_BASE
        SAVE_GCODE_STATE NAME=HMI_PARK_STATE
        M83
        {% if hot %}
            G1 E-2 F1800
            SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE=2
        {% endif %}
        {% if 'xyz' == printer.toolhead.homed_axes %}
            G91
            {% if lift > 0 %}
                G1 Z{lift} F300
            {% endif %}
            G90
            G1 X2 Y10 F3000
        {% endif %}
        RESTORE_GCODE_STATE NAME=HMI_PARK_STATE MOVE=0
        RESPOND MSG="Print paused. Replace filament, heat, load and purge before resuming."
    {% endif %}

[gcode_macro HMI_FILAMENT_HEAT]
description: Reheat to the temperature saved at pause (no movement)
gcode:
    {% set target = params.TEMP|default(printer['gcode_macro PAUSE'].saved_temp)|float %}
    {% if not printer.pause_resume.is_paused %}
        {action_raise_error("Filament recovery requires a paused print")}
    {% elif target < 170 or target >= printer.configfile.settings.extruder.max_temp|float %}
        {action_raise_error("No valid saved printing temperature")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=saved_temp VALUE={target}
        M104 S{target}
    {% endif %}

[gcode_macro _HMI_FILAMENT_MOVE]
gcode:
    {% set amount = params.AMOUNT|float %}
    {% set speed = params.SPEED|float %}
    {% if not printer.pause_resume.is_paused %}
        {action_raise_error("Filament recovery requires a paused print")}
    {% elif printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error("Position was lost. Do not home over the print or resume")}
    {% elif not printer.extruder.can_extrude or printer.extruder.target < 170 or printer.extruder.temperature < printer.extruder.target - 5 %}
        {action_raise_error("Heat the nozzle before moving filament")}
    {% elif amount < -80 or amount > 30 or speed < 1 or speed > 1200 %}
        {action_raise_error("Filament move outside recovery limits")}
    {% else %}
        SAVE_GCODE_STATE NAME=HMI_FILAMENT_STATE
        M83
        G1 E{amount} F{speed}
        M400
        RESTORE_GCODE_STATE NAME=HMI_FILAMENT_STATE MOVE=0
    {% endif %}

[gcode_macro HMI_FILAMENT_UNLOAD]
description: Withdraw 80 mm while paused and hot
gcode:
    _HMI_FILAMENT_MOVE AMOUNT=-80 SPEED=1200

[gcode_macro HMI_FILAMENT_LOAD]
description: Feed 30 mm while paused and hot (repeat if needed)
gcode:
    _HMI_FILAMENT_MOVE AMOUNT=30 SPEED=300

[gcode_macro HMI_FILAMENT_PURGE]
description: Purge 10 mm while paused and hot (repeat if needed)
gcode:
    _HMI_FILAMENT_MOVE AMOUNT=10 SPEED=180

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
    {% set target = printer['gcode_macro PAUSE'].saved_temp|float %}
    {% if not printer.pause_resume.is_paused %}
        {action_raise_error("Print is not paused")}
    {% elif printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error("Position was lost. Resume blocked")}
    {% elif printer['filament_switch_sensor filament_sensor'].enabled and not printer['filament_switch_sensor filament_sensor'].filament_detected %}
        {action_raise_error("Filament sensor is empty. Load filament before resuming")}
    {% elif target < 170 or target >= printer.configfile.settings.extruder.max_temp|float %}
        {action_raise_error("No valid saved printing temperature")}
    {% else %}
        M109 S{target}
        _HMI_RESUME_READY
    {% endif %}

[gcode_macro _HMI_RESUME_READY]
gcode:
    # Separate macro: evaluated after M109, so can_extrude is current.
    {% if not printer.pause_resume.is_paused or printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error("Paused position unavailable")}
    {% elif not printer.extruder.can_extrude %}
        {action_raise_error("Nozzle is not ready")}
    {% elif printer['filament_switch_sensor filament_sensor'].enabled and not printer['filament_switch_sensor filament_sensor'].filament_detected %}
        {action_raise_error("Filament sensor is empty")}
    {% else %}
        SAVE_GCODE_STATE NAME=HMI_RESUME_STATE
        M83
        G1 E{printer['gcode_macro PAUSE'].retracted} F300
        RESTORE_GCODE_STATE NAME=HMI_RESUME_STATE MOVE=0
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE=0
        RESUME_BASE VELOCITY=30
    {% endif %}
